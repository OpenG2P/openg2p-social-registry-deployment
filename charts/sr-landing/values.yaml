global:
  srAdminHostname: admin-sr.openg2p.sandbox.net
  srOdkCentralHostname: odk-sr.openg2p.sandbox.net
  srMinioHostname: minio-sr.openg2p.sandbox.net
  srOpensearchHostname: opensearch-sr.openg2p.sandbox.net
  srKafkaUiHostname: kafka-sr.openg2p.sandbox.net
  srSupersetHostname: superset-sr.openg2p.sandbox.net
  srLandingPageHostname: socialregistry.openg2p.sandbox.net

hostname: '{{ tpl .Values.global.srLandingPageHostname $ }}'

replicaCount: 1

image:
  repository: openg2p/openg2p-social-registry-landing
  tag: "develop"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

envVars:
  SR_ADMIN_URL: 'https://{{ tpl .Values.global.srAdminHostname $ }}'
  SR_REPORTING_URL: 'https://{{ tpl .Values.global.srOpensearchHostname $ }}'
  SR_LOGGING_URL: 'https://{{ tpl .Values.global.srOpensearchHostname $ }}'
  SR_MINIO_URL: 'https://{{ tpl .Values.global.srMinioHostname $ }}'
  SR_ODK_URL: 'https://{{ tpl .Values.global.srOdkCentralHostname $ }}'
  SR_KAFKA_URL: 'https://{{ tpl .Values.global.srKafkaUiHostname $ }}'
  SR_SUPERSET_URL: 'https://{{ tpl .Values.global.srSupersetHostname $ }}'

envVarsFrom: {}

service:
  type: ClusterIP
  port: 80

containerPort: 80

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  #
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

istio:
  enabled: true
  virtualservice:
    enabled: true
    host: ""
    gateway: "internal"
    destination: '{{ include "landing.fullname" . }}'
    destinationPort: '{{ .Values.service.port }}'
    prefix: ""
    rewriteUri: ""
  gateway:
    enabled: false
    host: ""
    ingressController:
      istio: ingressgateway
    httpTlsRedirect: true
    httpEnabled: true
    httpsEnabled: false
    tls:
      mode: SIMPLE
      credentialName: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

readinessProbe:
  httpGet:
    path: /
    port: 80
  failureThreshold: 20
  periodSeconds: 30
  timeoutSeconds: 10
  initialDelaySeconds: 30

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 15
  periodSeconds: 60
  failureThreshold: 5

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  helm.sh/revision: '{{ .Release.Revision }}'

podSecurityContext: {}
  # fsGroup: 2000

containerSecurityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}

updateStrategy:
  type: RollingUpdate

command: []
args: []


resources: {}
