global:
  keycloakBaseUrl: https://keycloak.openg2p.org
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/master'

  postgresqlHost: openg2p-commons-postgresql
  opensearchInstallationName: openg2p-commons-opensearch
  reportingInstallationName: openg2p-commons-reporting

  adminHostname: admin.devops.openg2p.org

  mailInstallationName: openg2p-commons-mail

  registryOdooOidcClientID: 'openg2p-sr-{{ .Release.Namespace }}'
  registryOdooOidcClientSecret: ''

  minioInstallationName: openg2p-commons-minio

  sysAdminEmail: admin@openg2p.sandbox.net

  keymanagerInstallationName: openg2p-commons-keymanager
  keymanagerAuthEnabled: false
  registryKeymanagerAppId: OPENG2P_SR

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    # Hard coding. Same as one defined under Odoo
    existingSecret: openg2p-commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  database:
    # Same as db in Odoo - make sure any changes to the name are synced with Odoo definitions
    name: '{{ .Release.Name }}_db'
    user: '{{ .Release.Name}}_db_user'
    # Same as odoo.externalDatabase.existingSecret - make sure these two are same if any changes are made.
    secret: '{{ .Release.Name }}'
    # As convention same as user
    secretUserPasswordKey: '{{ .Release.Name}}_db_user'

odoo:
  enabled: true

  hostname: '{{ tpl .Values.global.adminHostname $ }}'

  oidcIssuerUrl: '{{ tpl .Values.global.keycloakIssuerUrl $ }}'
  oidcClientId: '{{ tpl .Values.global.registryOdooOidcClientID $ }}'
  oidcClientSecret: '{{ tpl .Values.global.registryOdooOidcClientSecret $ }}'

  mailInstallationName: '{{ tpl .Values.global.mailInstallationName $ }}'
  keymanagerInstallationName: '{{ tpl .Values.global.keymanagerInstallationName $ }}'
  minioInstallationName: '{{ tpl .Values.global.minioInstallationName $ }}'

  extraAddonsUrlsToPull: ''

  image:
    repository: openg2p/openg2p-registry-core
    tag: develop
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80

  # TODO: Remove this and use global.sysAdminEmail
  odooEmail: admin@openg2p.org
  odooDatabaseFilter: ""

  withoutDemo: all

  loadDemoData: false  # This is redundant. Has no effect on inside the docker. Use withoutDemo instead.

  diagnosticMode:
    enabled: false  # Do not change this.

  livenessProbe:
    enabled: false

  containerSecurityContext:
    enabled: false

  podSecurityContext:
    enabled: false

  # We are using external database, hence default postgres is disabled
  postgresql:
    enabled: false

  externalDatabase:
    create: true
    # NOTE: For few parameter below the Odoo templates have been overridden to accomodate
    # templating. See templates/_helpers.tpl
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    database: '{{ .Release.Name }}_db'
    user: '{{ .Release.Name }}_db_user'
    # Provided via secrets below
    password: ""
    postgresqlPostgresUser: "postgres"
    # Passed via secrets
    postgresqlPostgresPassword: ""
    # The secrets below should be created before this installation is done.
    # Secret for the DB (not Postgresql server)
    existingSecret: '{{ .Release.Name }}'
    # This is secret for PostgreSQL server. Both have different secrets (unlike original Odoo
    # Chart where the same secret contained keys for both Postgres and the database user
    existingPostgresSecret: openg2p-commons-postgresql
    # Same as user name as convention
    existingSecretPasswordKey: '{{ .Release.Name }}_db_user'
    # Hardcoded as this is not likely to change frequently
    existingSecretPostgresPasswordKey: postgres-password

  extraEnvVars: '{{- include "socialRegistry.baseEnvVars" (dict "envVars" (merge (deepCopy .Values.envVars) (deepCopy .Values.envVarsFrom)) "context" $) }}'

  envVars:
    ODOO_SKIP_MODULES_UPDATE: yes
    LIMIT_TIME_REAL: 5000
    # This disables Odoo showing selection of databases if there are multiple databases (in our case we have only one DB for this deployment
    LIST_DB: False
    SERVER_WIDE_MODULES: base,web,queue_job

    # not using bitnami smtpHost and smtpPort variables, because of lack of templating
    OPENG2P_SMTP_HOST: '{{ tpl .Values.global.mailInstallationName $ }}'
    OPENG2P_SMTP_PORT: 25

    LOG_HANDLER: "'':INFO''"
    LOG_DB: False  # Do NOT use this. Use LOG_HANDLER instead.

    ODOO_BOOTSTRAP_MODULES: >-
      base,
      g2p_app_filter,
      g2p_auth_oidc,
      g2p_auth_oidc_keycloak,
      g2p_registry

    EXTRA_ADDONS_URLS_TO_PULL: '{{ tpl .Values.extraAddonsUrlsToPull $ }}'

    KEYMANAGER_API_BASE_URL: 'http://{{ tpl .Values.global.keymanagerInstallationName $ }}/v1/keymanager'
    KEYMANAGER_AUTH_ENABLED: '{{ .Values.global.keymanagerAuthEnabled }}'
    KEYMANAGER_AUTH_URL: '{{ tpl .Values.oidcIssuerUrl $ }}/protocol/openid-connect/token'
    KEYMANAGER_AUTH_CLIENT_ID: '{{ tpl .Values.oidcClientId $ }}'
    KEYMANAGER_AUTH_CLIENT_SECRET: '{{ tpl .Values.oidcClientSecret $ }}'
    KEYMANAGER_ENCRYPT_APP_ID: '{{ tpl .Values.global.registryKeymanagerAppId $ }}'
    KEYMANAGER_ENCRYPT_REF_ID: "ENCRYPT"
    KEYMANAGER_SIGN_APP_ID: '{{ tpl .Values.global.registryKeymanagerAppId $ }}'
    KEYMANAGER_SIGN_REF_ID: ""

    KEYCLOAK_ISSUER_URL: '{{ tpl .Values.oidcIssuerUrl $ }}'
    KEYCLOAK_CLIENT_ID: '{{ tpl .Values.oidcClientId $ }}'
    KEYCLOAK_CLIENT_SECRET: '{{ tpl .Values.oidcClientSecret $ }}'

    S3_URL: 'http://{{ tpl .Values.global.minioInstallationName $ }}:9000'
    # S3_REGION: "other"  # For minio
    WAIT_FOR_POSTGRES: 180

  envVarsFrom:
    S3_ACCESS_KEY_ID:
      secretKeyRef:
        key: root-user
        name: '{{ tpl .Values.global.minioInstallationName $ }}'
    S3_SECRET_ACCESS_KEY:
      secretKeyRef:
        key: root-password
        name: '{{ tpl .Values.global.minioInstallationName $ }}'

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /
      rewriteUri: ""
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

reporting-init:
  enabled: false
  reportingInstallationName: '{{ tpl .Values.global.reportingInstallationName $ }}'
  opensearchInstallationName: '{{ tpl .Values.global.opensearchInstallationName $ }}'
  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  gitConfig:
    enabled: true
    repoUrl: https://github.com/openg2p/openg2p-reporting
    branch: develop
    subDir: "scripts/social-registry"
  envVars:
    # Same as odoo.externalDatabase.database
    DB_NAME: '{{ .Release.Name }}_db'
  hookAnnotations:
    "helm.sh/hook-weight": "0"

loggingFlow:
  enabled: true
  opensearchInstallationName: '{{ tpl .Values.global.opensearchInstallationName $ }}'
  outputRef: '{{ tpl .Values.loggingFlow.opensearchInstallationName $ }}'
  extraLocalOutputRefs: []
  globalOutputRefs: []
  parser:
    key_name: message
    parse:
      type: regexp
      expression: /^(?<asctime>(\S+)(\s)(\S+))\s+(?<pid>\S+)\s+(?<levelname>\S+)\s+(?<dbname>\S+)\s+(?<name>\S+)\s+(?<message>.*)$/
    remove_key_name_field: true
    replace_invalid_sequence: true
    reserve_data: true
  extraFilters: []

idgenerator:
  enabled: true
  hostname: '{{ tpl .Values.global.adminHostname $ }}'
  artifactoryInstallationName: openg2p-commons-artifactory
  postgresqlInstallationName: '{{ tpl .Values.global.postgresqlHost $ }}'
  springCloudConfig:
    enabled: true
    profile: default
    gitRepo:
      url: https://github.com/openg2p/mosip-config
      branch: master
  envVars:
    auth_server_admin_allowed_audience: 'openg2p-sr,openg2p-sr-{{ .Release.Namespace }}'
  envVarsFrom:
    db_dbuser_password:
      secretKeyRef:
        name: '{{ tpl .Values.global.postgresqlHost $ }}-addl-user-passwords'
        key: kerneluser

mosipKernelPostgresInit:
  enabled: true
  image:
    repository: mosipid/postgres-init
    tag: 1.2.0.1-B4
    pullPolicy: Always
  containerSecurityContext:
    enabled: false
  podSecurityContext:
    enabled: false
  commonAnnotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
  command:
    - bash
  args:
    - -c
    - until pg_isready -h ${DB_SERVERIP} -p ${DB_PORT}; do sleep 3; done && ./postgres-init.sh

  envVars:
    MOSIP_DB_NAME: mosip_kernel
    DB_SERVERIP: '{{ tpl .Values.global.postgresqlHost $ }}'
    DB_PORT: '5432'
    SU_USER: postgres
    DB_USER: kerneluser
    DML_FLAG: '0'
    GIT_REPO_URL: https://github.com/mosip/commons.git
    GIT_BRANCH: v1.2.0.1
  envVarsFrom:
    SU_USER_PWD:
      secretKeyRef:
        name: '{{ tpl .Values.global.postgresqlHost $ }}'
        key: postgres-password
    DBUSER_PWD:
      secretKeyRef:
        name: '{{ tpl .Values.global.postgresqlHost $ }}-addl-user-passwords'
        key: kerneluser

redis:
  # Default name of the redis service is .Release.Name-redis-master
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: openg2p/redis
    tag: 7.2.5-debian-12-r4
  auth:
    enabled: false
  master:
    resourcesPreset: none
    persistence:
      enabled: false

openg2p-registry-bg-tasks:
  enabled: true
  nameOverride: bg-tasks

  redisInstallationName: '{{ .Release.Name }}-redis-master'
  postgresqlInstallationName: '{{ .Values.global.postgresqlHost }}'

  producer:
    enabled: true
    image:
      tag: "1.1.1"
    envVars:
      # Same as Odoo DB, make sure they are in sync if names are changed
      REGISTRY_CELERY_BEAT_DB_DBNAME: '{{ .Release.Name }}_db'
      REGISTRY_CELERY_BEAT_DB_USERNAME: '{{ .Release.Name }}_db_user'
    envVarsFrom:
      REGISTRY_CELERY_BEAT_DB_PASSWORD:
        secretKeyRef:
          name: '{{ .Release.Name }}'
          key: '{{ .Release.Name }}_db_user'
  worker:
    enabled: true
    image:
      tag: "1.1.1"
    envVars:
      REGISTRY_CELERY_WORKERS_AUTH_CLIENT_ID: '{{ tpl .Values.global.registryOdooOidcClientID $ }}'
      REGISTRY_CELERY_WORKERS_AUTH_CLIENT_SECRET: '{{ tpl .Values.global.registryOdooOidcClientSecret $ }}'
      REGISTRY_CELERY_WORKERS_DB_HOSTNAME: '{{ tpl .Values.postgresqlInstallationName $ }}'
      REGISTRY_CELERY_WORKERS_DB_PORT: 5432
      REGISTRY_CELERY_WORKERS_DB_DBNAME: '{{ .Release.Name }}_db'
      REGISTRY_CELERY_WORKERS_DB_USERNAME: '{{ .Release.Name }}_db_user'
    envVarsFrom:
      REGISTRY_CELERY_WORKERS_DB_PASSWORD:
        secretKeyRef:
          name: '{{ .Release.Name }}'
          key: '{{ .Release.Name }}_db_user'
