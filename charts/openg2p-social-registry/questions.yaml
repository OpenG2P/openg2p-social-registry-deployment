questions:
- variable: global.adminHostname
  description: Hostname to access Registry Admin UI
  type: string
  label: Hostname
  group: General Settings

- variable: global.keycloakBaseUrl
  description: Keycloak Base Url used in all components
  type: string
  label: Keycloak Base URL
  group: General Settings

- variable: global.postgresqlHost
  description: Host name for Postgresql that is installed externally
  type: string
  label: Postgresql Hostname
  group: General Settings

- variable: global.oidcClientID
  description: OIDC client ID
  type: string
  label: OIDC Client ID
  group: General Settings

- variable: global.oidcClientSecret
  description: OIDC client Kubernetes secret name
  type: string
  label: OIDC Client Secret Name
  group: General Settings

- variable: global.oidcClientSecretKey
  description: Key containing OIDC client password
  type: string
  label: OIDC Client Secret Key
  group: General Settings

- variable: odoo.extraAddonsUrlsToPull
  description: |-
    Comma separated.
    Example git://17.0-develop//https://github.com/openg2p/openg2p-registry.
  type: string
  label: List of additional addons to be pulled.
  group: General Settings

# MinIO Settings
- variable: global.minioInstallationName
  description: Internal service name of MinIO
  type: reference_service
  label: MinIO internal service name
  group: MinIO Settings

# OpenSearch Settings
- variable: global.opensearchInstallationName
  description: Internal service name of Opensearch
  type: reference_service
  label: Opensearch internal service name
  group: OpenSearch Settings

# Logging Settings
- variable: loggingFlow.enabled
  description: This will enable Fluentd to capture logs into OpenSearch.
  type: boolean
  label: Enable logs capture?
  group: Logging Settings

# Keymanager
- variable: global.keymanagerInstallationName
  description: Internal service name of Keymanager service
  type: reference_service
  label: Keymanager internal service name
  group: Keymanager Settings

- variable: global.keymanagerAuthEnabled
  label: API Authentication Enabled
  description: Enables Keymanager API Authentication.
  type: boolean
  group: Keymanager Settings

# IDGenerator Settings
- variable: idgenerator.enabled
  description: This installs ID Generator for generating unique IDs
  type: boolean
  label: Install ID Generator?
  group: ID Generator Settings

- variable: idgenerator.springCloudConfig.profile
  type: string
  label: Spring Config Profile
  group: ID Generator Settings
  show_if: "idgenerator.enabled=true"

- variable: idgenerator.springCloudConfig.enabled
  description: Enables Spring Cloud Config (config-server) (Config from Git repo).
  type: boolean
  label: Spring Cloud Config Enabled
  group: ID Generator Settings
  show_if: "idgenerator.enabled=true"
  show_subquestion_if: true
  subquestions:
  - variable: idgenerator.springCloudConfig.gitRepo.url
    description: |-
      Repo Url for remote Git repo containing configs.
      This url should include username password if required.
    type: string
    label: Spring Cloud Config Git Repo Url
    group: ID Generator Settings

  - variable: idgenerator.springCloudConfig.gitRepo.branch
    description: Branch of remote Git repo containing configs.
    type: string
    label: Spring Cloud Config Git Repo Branch
    group: ID Generator Settings

- variable: idgenerator.envVars.auth_server_admin_allowed_audience
  description: |-
    List of Keycloak Client ID allowed to call this idgenerator's APIs.
    Do not edit this parameter unless required.
  type: string
  label: Allowed Keycloak Client IDs.
  group: ID Generator Settings
  show_if: "idgenerator.enabled=true"

# Reporting
- variable: reporting-init.enabled
  description: This initializes Reporting Connectors for Social Registry
  type: boolean
  label: Initialize Reporting Connectors (reporting-init)?
  group: Reporting Settings

- variable: reporting-init.reportingInstallationName
  description: Internal service name of Reporting service
  type: string
  label: Reporting internal service name
  group: Reporting Settings
  show_if: "reporting-init.enabled=true"

- variable: reporting-init.gitConfig.enabled
  description: This enables downloading connectors and other Reporting-init configuration from Git.
  type: boolean
  label: Download reporting-init config from Git?
  group: Reporting Settings
  show_if: "reporting-init.enabled=true"

- variable: reporting-init.gitConfig.repoUrl
  description: Git Repository to download configs from. This must include username password if any.
  type: string
  label: Git Config Repository URL
  group: Reporting Settings
  show_if: "reporting-init.enabled=true&&reporting-init.gitConfig.enabled=true"

- variable: reporting-init.gitConfig.branch
  description: Git Repository Branch to download configs from.
  type: string
  label: Git Config Repository Branch
  group: Reporting Settings
  show_if: "reporting-init.enabled=true&&reporting-init.gitConfig.enabled=true"

- variable: reporting-init.gitConfig.subDir
  description: Subdirectory inside the Git Repository to take configs from.
  type: string
  label: Git Config Repository Subdirectory
  group: Reporting Settings
  show_if: "reporting-init.enabled=true&&reporting-init.gitConfig.enabled=true"

# OpenG2P Registry Background Tasks
- variable: openg2p-registry-bg-tasks.enabled
  description: This installs Registry Background Tasks.
  type: boolean
  label: Install Registry Background Tasks?
  group: Registry Background Tasks Settings
