apiVersion: v2
name: openg2p-registry
description: A Helm chart for OpenG2P Registry
type: application
version: 0.0.0-develop
dependencies:
- name: odoo
  version: 26.2.9
  repository: https://openg2p.github.io/openg2p-helm
  condition: odoo.enabled
- name: idgenerator
  version: 12.0.2
  repository: https://openg2p.github.io/openg2p-helm
  condition: idgenerator.enabled
- name: reporting-init
  version: 1.3.0-develop
  repository: https://openg2p.github.io/openg2p-helm
  condition: reporting-init.enabled
- name: redis
  version: 19.x.x
  repository: https://openg2p.github.io/openg2p-helm
  condition: redis.enabled
- name: openg2p-registry-bg-tasks
  version: 1.1.0-develop
  repository: https://openg2p.github.io/openg2p-helm
  condition: openg2p-registry-bg-tasks.enabled
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
annotations:
  catalog.cattle.io/display-name: "OpenG2P Registry"
  openg2p.org/add-to-rancher: ""
